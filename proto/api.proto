syntax = "proto3";

package service;

option go_package = "github.com/valentin-kaiser/hdns/pkg/proto/service";

option optimize_for = SPEED;

// HDNS is the main service for HDNS.
service HDNS {
  // GetZones returns all zones.
  rpc GetZones (Record) returns (ZoneList);

  // GetRecords returns all records.
  rpc GetRecords (Request) returns (RecordList);

  // UpsertRecord creates or updates a record.
  rpc UpsertRecord (Record) returns (Record);

  // DeleteRecord deletes a record.
  rpc DeleteRecord (RecordDelete) returns (Empty);

  // RefreshRecord refreshes the record's address.
  rpc RefreshRecord (Record) returns (Record);

  // FetchHetznerRecord returns the A record currently defined in Hetzner for this record.
  rpc FetchHetznerRecord (Record) returns (Address);

  // ResolveRecord resolves the record's domain.
  rpc ResolveRecord (Record) returns (ResolutionResult);

  // StreamResolveRecord streams the resolution results for the record.
  rpc StreamResolveRecord (Record) returns (stream Resolution);

  // StreamAddress streams the current address.
  rpc StreamAddress (Empty) returns (stream Address);

  // GetAddress returns the current address.
  rpc GetAddress (Empty) returns (Address);

  // GetAddressHistory returns the address history.
  rpc GetAddressHistory (Empty) returns (AddressHistory);

  // RefreshAddress refreshes the current address.
  rpc RefreshAddress (Empty) returns (Address);

  // GetCertificates returns all certificates.
  rpc GetCertificates (Empty) returns (CertificateList);

  // IssueCertificate issues or re-issues the certificate for a record.
  rpc IssueCertificate (Record) returns (Certificate);

  // GetCertificateDetails returns detailed information about a certificate for a record.
  rpc GetCertificateDetails (Record) returns (CertificateDetails);

  // GetTasks returns all renewal tasks.
  rpc GetTasks (Empty) returns (TaskList);

  // UpsertTask creates or updates a renewal task.
  rpc UpsertTask (Task) returns (Task);

  // DeleteTask deletes a renewal task.
  rpc DeleteTask (TaskDelete) returns (Empty);

  // RunTask executes a renewal task immediately and returns the result.
  rpc RunTask (Task) returns (TaskResult);

  // GetConfig returns the current configuration.
  rpc GetConfig (Empty) returns (Configuration);

  // UpdateConfig updates the current configuration.
  rpc UpdateConfig (Configuration) returns (Configuration);

  // StreamLog streams live ACME issuance log lines.
  // While issuance is in progress, lines are sent as they are produced.
  // If the most recent job is complete, the stored log is replayed immediately.
  rpc StreamLog (Empty) returns (stream Line);
}

message Empty {

}

message Line {
  string line      = 1;
}

message Request {
  string search = 1;
}

// Address represents an IP address.
message Address {
  int64  id         = 1;
  int64  created_at = 2;
  int64  updated_at = 3;
  string ipv4       = 4;
  string ipv6       = 5;
  bool   current    = 6;
}

message AddressHistory {
  repeated Address addresses = 1;
}

enum RecordPurpose {
  RECORD_PURPOSE_UNSPECIFIED = 0;
  RECORD_PURPOSE_DDNS        = 1;
  RECORD_PURPOSE_CERT        = 2;
  RECORD_PURPOSE_BOTH        = 3;
}

// Record represents a DNS record.
message Record {
  int64         id               = 1;
  int64         created_at       = 2;
  int64         updated_at       = 3;
  string        token            = 4;
  int64         zone_id          = 5;
  string        domain           = 6;
  string        name             = 7;
  uint32        ttl              = 8;
  int64         address_id       = 9;
  Address       address          = 10;
  RecordPurpose purpose          = 11;
  bool          include_wildcard = 12;
  Certificate   certificate      = 13;
  string        acme_email       = 14;
}

message RecordList {
  repeated Record records = 1;
}

message RecordDelete {
  Record record              = 1;
  bool   delete_from_hetzner = 2;
}

// Certificate represents an issued Let's Encrypt certificate.
message Certificate {
  int64  id         = 1;
  int64  created_at = 2;
  int64  updated_at = 3;
  int64  record_id  = 4;
  string domains    = 5;
  string status     = 6;
  int64  not_before = 7;
  int64  not_after  = 8;
  string serial     = 9;
  string last_error = 10;
}

message CertificateList {
  repeated Certificate certificates = 1;
}

// CertificateArtifact describes a downloadable certificate file.
message CertificateArtifact {
  string key          = 1;
  string label        = 2;
  bool   available    = 3;
  string download_url = 4;
}

// CertificateIssuanceJob represents a single certificate issuance attempt.
message CertificateIssuanceJob {
  int64  id             = 1;
  string source         = 2;
  string status         = 3;
  int64  started_at     = 4;
  int64  finished_at    = 5;
  int64  duration_ms    = 6;
  string error          = 7;
  int64  certificate_id = 8;
}

// CertificateTaskRun represents a webhook task execution triggered by a certificate event.
message CertificateTaskRun {
  int64  id                 = 1;
  int64  task_id            = 2;
  string task_name          = 3;
  string status             = 4;
  string response_status    = 5;
  string error              = 6;
  int64  started_at         = 7;
  int64  finished_at        = 8;
  int64  duration_ms        = 9;
  int64  certificate_job_id = 10;
}

// CertificateDetails aggregates certificate info, artifacts, and job history for a record.
message CertificateDetails {
  int64                        record_id      = 1;
  string                       record_name    = 2;
  string                       record_domain  = 3;
  Certificate                  certificate    = 4;
  repeated CertificateArtifact artifacts      = 5;
  repeated CertificateIssuanceJob issuance_jobs = 6;
  repeated CertificateTaskRun  task_runs      = 7;
  int64                        fetched_at     = 8;
}

enum TaskTrigger {
  TASK_TRIGGER_UNSPECIFIED = 0;
  TASK_TRIGGER_IP          = 1;
  TASK_TRIGGER_CERT        = 2;
  TASK_TRIGGER_BOTH        = 3;
}

// Task represents a webhook executed on IP or certificate renewal.
message Task {
  int64       id         = 1;
  int64       created_at = 2;
  int64       updated_at = 3;
  int64       record_id  = 4;
  string      name       = 5;
  TaskTrigger trigger_on = 6;
  string      method     = 7;
  string      url        = 8;
  // headers is a JSON object of HTTP headers. It is write-only and never
  // returned populated to avoid exposing secrets.
  string headers     = 9;
  string body        = 10;
  bool   enabled     = 11;
  int64  last_run    = 12;
  string last_status = 13;
  string last_error  = 14;
  // include_certificate injects the issued certificate and private key into the
  // webhook body via the {{certificate}} and {{private_key}} placeholders.
  bool include_certificate = 15;
  // certificate_format controls the certificate payload representation.
  // Valid values are "pem" and "pkcs12". Defaults to "pem".
  string certificate_format = 16;
}

message TaskList {
  repeated Task tasks = 1;
}

message TaskDelete {
  int64 id = 1;
}

message TaskResult {
  string status = 1;
  string error  = 2;
}

message Zone {
  int64  id           = 1;
  string name         = 2;
  int64  record_count = 3;
}

message ZoneList {
  repeated Zone zones = 1;
}

message Resolution {
  string          server        = 1;
  repeated string addresses     = 2;
  int64           response_time = 3;
  string          error         = 4;
}

message ResolutionResult {
  repeated Resolution resolutions = 1;
}

message Configuration {
  int32           log_level      = 1;
  string          refresh_cron   = 2;
  repeated string dns_servers    = 3;
  repeated string ipv4_resolvers = 4;
  repeated string ipv6_resolvers = 5;

  // User-facing notification settings. SMTP transport (host, port, auth, TLS,
  // from address, ...) is intentionally NOT part of this message and is
  // configured via the YAML file only.
  bool            notifications_enabled          = 6;
  bool            notifications_on_success       = 7;
  repeated string notifications_recipients       = 8;
  int32           notifications_cooldown_minutes = 9;
  string          notifications_subject_prefix   = 10;

  // ACME / Let's Encrypt settings for DNS-01 certificate issuance.
  bool   acme_enabled           = 11;
  string acme_email             = 12;
  bool   acme_staging           = 13;
  int32  acme_renew_before_days = 14;
}

message LogEntry {
  int64  timestamp = 1;
  int32  level     = 2;
  string message   = 3;
}